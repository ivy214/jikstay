<body>
  <!-- 0.05초 만에 실제 오늘의 로컬 스토리를 먼저 보여주는 즉시 프리뷰 스플래시 -->

        <div class="js-story-body">
          <p class="js-story-src">전북 장수군 · 장수군청 공식 가이드북 《장수여행》 p.9 수록</p>
          <p class="js-story-title">금강첫물, 뜬봉샘 발원지</p>

  <script>
    // 구버전 Flutter Service Worker가 남아 4초간 부트스트랩을 지연시키는 현상을 즉시 제거
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
      }).catch(function () {});
    }

    // 앱 엔진 다운로드와 동시에 공공 여행 허브 JSON을 미리 메모리에 적재
    var __jikstayPrefetch = {};
    function __prefetchUrl(url) {
      if (!__jikstayPrefetch[url]) {
        __jikstayPrefetch[url] = fetch(url, { cache: "default" })
          .then(function (r) { return r.ok ? r.text() : ""; })
          .catch(function () { return ""; });
      }
      return __jikstayPrefetch[url];
    }
    // 앱(fetchHubCore)과 같은 URL 이어야 같은 요청을 두 번 보내지 않는다 (버전 쿼리 없음: max-age=300 + ETag 재검증)
    __prefetchUrl("data/hub/core.json");

    // 공유 링크(?id= ?spot= ?story=)로 들어오면 서버가 넣어 둔 OG 정보로 그 장소를 먼저 보여 준다
    (function () {
      try {
        var q = new URLSearchParams(window.location.search);
        if (!(q.get("id") || q.get("spot") || q.get("story"))) return;
        var meta = function (p) {
          var e = document.querySelector('meta[property="' + p + '"]');
          return e ? (e.getAttribute("content") || "") : "";
        };
        var title = meta("og:title").replace(/\s*\|.*$/, "");
        if (!title) return;
        var set = function (sel, text) { var el = document.querySelector(sel); if (el) el.textContent = text; };
        set(".js-story-title", title);
        set(".js-story-desc", meta("og:description"));
        set(".js-story-src", "");
        set(".js-story-addr", "");
        var badges = document.querySelector(".js-story-badges");
        if (badges) badges.innerHTML = '<span class="js-badge-dark">🔗 공유된 장소</span>';
        var img = document.querySelector(".js-story-img-wrap img");
        var ogImg = meta("og:image");
        if (img && ogImg) { img.src = ogImg; img.alt = title; }
        else if (img) { img.parentNode.style.display = "none"; }
      } catch (_) {}
    })();
    setTimeout(function () { __prefetchUrl("data/public_stays_index.json"); }, 120);

    function __hideSplash() {
      var el = document.getElementById("jikstay-splash");
      if (!el || el.classList.contains("fade-out")) return;
      el.classList.add("fade-out");
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 240);
    }
    window.addEventListener("flutter-first-frame", __hideSplash);

    window.jikstaySyncUrl = function (listingId) {
      try {
        var url = new URL(window.location.href);
        if (listingId) { url.searchParams.set("id", listingId); }
        else { url.searchParams.delete("id"); }
        window.history.replaceState(window.history.state, "", url.toString());
      } catch (_) {}
    };
    window.jikstaySyncPortalParams = function (region, spotId, storyId) {
      try {
        var url = new URL(window.location.href);
        if (region && region !== "전체") { url.searchParams.set("region", region); }
        else { url.searchParams.delete("region"); }
        if (spotId) { url.searchParams.set("spot", spotId); }
        else { url.searchParams.delete("spot"); }
        if (storyId) { url.searchParams.set("story", storyId); }
        else { url.searchParams.delete("story"); }
        window.history.replaceState(window.history.state, "", url.toString());
      } catch (_) {}
    };
    window.jikstayResetHomeUrl = function (region) {
      try {
        var url = new URL(window.location.href);
        ["spot", "story", "id", "plan", "topic"].forEach(function (k) { url.searchParams.delete(k); });
        if (region && region !== "전체") { url.searchParams.set("region", region); }
        else { url.searchParams.delete("region"); }
        window.history.replaceState(window.history.state, "", url.toString());
      } catch (_) {}
    };
    window.jikstayTrackEvent = function (eventName, payloadJson) {
      try {
        var params = payloadJson ? JSON.parse(payloadJson) : {};
        if (typeof window.gtag === "function") {
          window.gtag("event", eventName, params);
        } else if (Array.isArray(window.dataLayer)) {
          window.dataLayer.push(Object.assign({ event: eventName }, params));
        }
        window.__jikstayEvents = window.__jikstayEvents || [];
        if (window.__jikstayEvents.length > 50) window.__jikstayEvents.shift();
        window.__jikstayEvents.push({ event: eventName, params: params, ts: Date.now() });
      } catch (_) {}
    };
    window.jikstayCurrentOrigin = function () {
      return window.location.origin || "";
    };
    window.jikstayFetchText = function (url) {
      return __prefetchUrl(url);
    };
    // 찜 목록 등 기기 내 저장 (사생활 보호 모드에서 막혀도 앱은 계속 동작)
    window.jikstayStoreGet = function (key) {
      try { return window.localStorage.getItem(key); } catch (_) { return null; }
    };
    window.jikstayStoreSet = function (key, value) {
      try { window.localStorage.setItem(key, value); } catch (_) {}
    };
    // '내 주변' 정렬용 현재 위치 ("위도,경도" 또는 빈 문자열). 위치는 기기 안에서만 쓰고 저장·전송하지 않는다.
    window.jikstayGeo = function () {
      return new Promise(function (resolve) {
        if (!navigator.geolocation) return resolve("");
        navigator.geolocation.getCurrentPosition(
          function (p) { resolve(p.coords.latitude + "," + p.coords.longitude); },
          function () { resolve(""); },
          { enableHighAccuracy: false, timeout: 8000, maximumAge: 600000 }
        );
      });
    };
    // 기기 공유 시트. 지원하지 않거나 사용자가 취소하면 false
    window.jikstayShare = function (title, url) {
      if (!navigator.share) return Promise.resolve(false);
      return navigator.share({ title: title, url: url }).then(function () { return true; }, function () { return false; });
    };
  </script>
