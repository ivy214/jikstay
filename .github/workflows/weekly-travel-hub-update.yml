name: Weekly Travel Hub Refresh

on:
  schedule:
    # 매주 월요일 06:00 KST (일요일 21:00 UTC)
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-travel-hub
  cancel-in-progress: false

jobs:
  refresh-hub:
    runs-on: ubuntu-latest
    env:
      # 시크릿 이름은 로컬 .env 변수 이름과 같게 맞춘다.
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # 행안부 인허가 API 주소(비밀 아님). 농어촌민박업은 license_check.py 기본값 사용
      LICENSE_API_LODGING: https://apis.data.go.kr/1741000/lodgings
      LICENSE_API_HANOK: https://apis.data.go.kr/1741000/hanok_experience
      LICENSE_API_FOREIGN: https://apis.data.go.kr/1741000/foreigner_city_homestays
      FIREBASE_BUCKET: jikstay-lkxu1.firebasestorage.app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        # build_travel_hub → curate_public_stays → license_check 가 firebase_admin 등을 import 하므로 전체 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Firebase Admin credentials (Firestore spots·listings 갱신용)
        id: admin
        continue-on-error: true  # 키가 잘못돼도 축제 갱신·커밋은 계속하고, 끝에서 실패로 표시
        env:
          FB_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JIKSTAY }}
        run: |
          if [ -n "$FB_SA" ]; then
            printf '%s' "$FB_SA" > "$RUNNER_TEMP/firebase-admin.json"
            # 붙여 넣기 실수(일부만 복사·앞뒤 문자)를 바로 알 수 있게 형식만 검사하고 계정 이름을 남긴다 (키 값은 출력 안 함)
            if ! python -c "import json,sys; d=json.load(open(sys.argv[1])); assert d.get('type')=='service_account' and d.get('private_key') and d.get('client_email'); print('서비스 계정:', d['client_email'], '/ 프로젝트:', d.get('project_id'))" "$RUNNER_TEMP/firebase-admin.json"; then
              echo "::error::FIREBASE_SERVICE_ACCOUNT_JIKSTAY 시크릿이 서비스 계정 키 JSON 형식이 아닙니다. 키 파일 내용 전체({ 부터 } 까지)를 다시 등록하세요."
              rm -f "$RUNNER_TEMP/firebase-admin.json"
              exit 1
            fi
            echo "FIREBASE_CREDENTIALS=$RUNNER_TEMP/firebase-admin.json" >> "$GITHUB_ENV"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_JIKSTAY 시크릿이 없어 Firestore 갱신·숙소 인허가 재확인을 건너뜁니다."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh weekly festivals
        run: python backend/weekly_hub_refresh.py --no-translate

      # 볼거리·먹거리: 관광공사 목록에서 사라진 곳 제거 · 반값여행 시·군 보충 · 최근 14일 신규 등록 추가
      - name: Refresh spots (attractions & food)
        id: spots
        continue-on-error: true
        run: |
          if [ "${{ steps.admin.outputs.enabled }}" = "true" ]; then
            python backend/weekly_spot_refresh.py
          else
            python backend/weekly_spot_refresh.py --no-firestore
          fi

      # 숙소: 행안부 인허가 영업상태 재확인 → 폐업·휴업 확실하면 노출 중지 + 정적 색인에서 제외
      - name: Recheck stay licenses
        id: licenses
        if: steps.admin.outputs.enabled == 'true'
        continue-on-error: true
        # 인허가 출처는 4주에 한 번씩(매주 1/4), 관광공사 출처는 매주 전체를 관광공사 숙박 목록과 대조
        run: python backend/license_check.py recheck --workers 3 --rotate 4 --prune-index

      - name: Incremental translations (EN/JA/ZH)
        id: translate
        if: env.GEMINI_API_KEY != ''
        continue-on-error: true
        run: python backend/translate_hub.py --gemini

      - name: Generate weekly digest
        run: python backend/generate_weekly_digest.py

      - name: Commit updated travel hub JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/web/data/public_travel_hub.json app/web/data/public_stays_index.json backend/stays_index_suspended.json \
                  app/web/data/translations_en.json app/web/data/translations_ja.json app/web/data/translations_zh.json \
                  backend/translation_cache.json \
                  docs/weekly_digest.md docs/weekly_digest_sns.txt
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): weekly festival, spot, license & translation refresh"
            git push
          fi

      - name: Check Firebase deploy secret
        id: fb
        env:
          FB_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JIKSTAY }}
        run: |
          if [ -n "$FB_SA" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        if: steps.fb.outputs.enabled == 'true'
        uses: subosito/flutter-action@v2
        with:
          # pubspec.yaml 의 sdk: ^3.14.0 (Dart 3.14) 를 만족하는 로컬과 같은 버전
          flutter-version: "3.50.0"
          channel: "stable"
          cache: true

      - name: Build Flutter web
        if: steps.fb.outputs.enabled == 'true'
        env:
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
        working-directory: app
        run: |
          python ../backend/split_hub.py
          flutter pub get
          if [ -n "$RECAPTCHA_SITE_KEY" ]; then
            flutter build web --release --no-wasm-dry-run --pwa-strategy=none --dart-define="RECAPTCHA_SITE_KEY=$RECAPTCHA_SITE_KEY"
          else
            echo "::warning::RECAPTCHA_SITE_KEY 시크릿이 없어 App Check 없이 빌드합니다."
            flutter build web --release --no-wasm-dry-run --pwa-strategy=none
          fi

      - name: Stage files (same rules as deploy.ps1)
        id: stage
        if: steps.fb.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          rm -rf firebase/public
          mkdir -p firebase/public
          # index.html 은 public 에 두면 serveApp(OG·JSON-LD 주입) rewrite 가 무시되므로 제외한다.
          rsync -a \
            --exclude 'index.html' --exclude '*.map' --exclude '*.symbols' \
            --exclude 'skwasm*' --exclude 'wimp*' \
            app/build/web/ firebase/public/
          if [ -e firebase/public/index.html ]; then
            echo "::error::firebase/public/index.html 이 존재하면 OG 태그 함수가 동작하지 않습니다."
            exit 1
          fi
          # 템플릿이 바뀐 경우에만 functions 도 함께 배포한다.
          if cmp -s app/build/web/index.html firebase/functions/index.html; then
            echo "targets=hosting" >> "$GITHUB_OUTPUT"
          else
            cp app/build/web/index.html firebase/functions/index.html
            echo "targets=hosting,functions" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Functions dependencies
        if: steps.fb.outputs.enabled == 'true' && contains(steps.stage.outputs.targets, 'functions')
        working-directory: firebase/functions
        run: npm ci

      - name: Deploy to Firebase
        if: steps.fb.outputs.enabled == 'true'
        env:
          FB_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JIKSTAY }}
        working-directory: firebase
        run: |
          set -euo pipefail
          # firebase-tools 는 키 "파일 경로"를 GOOGLE_APPLICATION_CREDENTIALS 로 읽는다.
          printf '%s' "$FB_SA" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools deploy --only "${{ steps.stage.outputs.targets }}" --project jikstay-lkxu1 --non-interactive
          rm -f "$RUNNER_TEMP/firebase-sa.json"

      - name: Remove Firebase Admin credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-admin.json"

      - name: Fail if spot refresh or license recheck failed
        # !cancelled() 가 없으면 앞 단계(배포 등)가 실패했을 때 이 검사 자체가 건너뛰어진다
        if: ${{ !cancelled() && (steps.admin.outcome == 'failure' || steps.spots.outcome == 'failure' || steps.licenses.outcome == 'failure') }}
        run: |
          echo "::error::Firebase 키(${{ steps.admin.outcome }}) · 볼거리·먹거리 갱신(${{ steps.spots.outcome }}) · 숙소 인허가 재확인(${{ steps.licenses.outcome }}) 중 실패한 단계가 있습니다. 나머지 데이터는 커밋됐습니다."
          exit 1

      - name: Fail if translation failed
        if: ${{ !cancelled() && steps.translate.outcome == 'failure' }}
        run: |
          echo "::error::다국어 번역 단계가 실패했습니다. 축제 데이터는 커밋·배포됐지만 번역은 이전 버전입니다."
          exit 1
