name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - run: flutter pub get
      # material.dart deprecation 등 info 수준 알림은 실패로 보지 않는다.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  firebase:
    name: Firestore/Storage rules & Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            firebase/package-lock.json
            firebase/functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: |
          npm ci --prefix firebase
          npm ci --prefix firebase/functions
          npm install -g firebase-tools@15
      - name: Functions unit tests
        working-directory: firebase
        run: node --test tests/functions.test.mjs
      - name: Security rules tests (emulator)
        working-directory: firebase
        # demo- 프로젝트는 로그인·실서버 접근 없이 에뮬레이터만 사용한다.
        run: firebase emulators:exec --project demo-jikstay --only firestore,storage "node --test tests/rules.test.mjs"

  python:
    name: Backend tests (no API keys)
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Compile all backend scripts
        run: python -m compileall -q backend
      - name: Unit tests
        run: |
          set -e
          for t in smoke_test admin_test curate_test naver_filters_test split_hub_test license_recheck_test markets_test culture_test outdoor_test translate_budget_test trails_test; do
            echo "::group::$t"
            python backend/tests/$t.py
            echo "::endgroup::"
          done
