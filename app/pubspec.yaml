name: jikstay
description: "직스테이 · 수수료 0원 합법 숙소 검색 및 직거래 플랫폼"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  firebase_app_check: ^0.5.1
  url_launcher: ^6.3.3
  firebase_auth: ^7.0.1
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL-NotoColorEmoji.txt
    - assets/fonts/OFL-NotoSansKR.txt
  # 앱에서 쓰는 이모지만 담은 Noto Color Emoji 서브셋 (tool/build_emoji_font.py 로 생성).
  # 없으면 CanvasKit 이 gstatic 에서 이모지 폰트 조각(최대 약 2MB)을 런타임에 받는다.
  # AppKR: Noto Sans KR 400 의 한글 2,350자 + 사용 글자 서브셋 (tool/build_korean_font.py 로 생성).
  fonts:
    - family: AppKR
      fonts:
        - asset: assets/fonts/AppKR.ttf
    - family: AppEmoji
      fonts:
        - asset: assets/fonts/AppEmoji.ttf
